<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>modfence</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg transform='translate(1 .8)' fill='none' stroke='%23ff48b0' stroke-width='2.2' stroke-linejoin='round' stroke-linecap='round'%3E%3Cpath d='M2 13.5H30M2 21.5H30'/%3E%3Cpath d='M5 28V10.5L7 7L9 10.5V28ZM14 28V9.5L16 6L18 9.5V28ZM23 28V10.5L25 7L27 10.5V28Z'/%3E%3C/g%3E%3Cpath d='M2 13.5H30M2 21.5H30' stroke='%2322201c' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M5 28V10.5L7 7L9 10.5V28ZM14 28V9.5L16 6L18 9.5V28ZM23 28V10.5L25 7L27 10.5V28Z' fill='%23fbf8f1' stroke='%2322201c' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top" role="banner">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><defs><filter id="pencil" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.3" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.1"/></filter></defs><g filter="url(#pencil)"><g class="mis" transform="translate(1 .8)"><path d="M2 13.5H30M2 21.5H30"/><path d="M5 28V10.5L7 7L9 10.5V28ZM14 28V9.5L16 6L18 9.5V28ZM23 28V10.5L25 7L27 10.5V28Z"/></g><path class="rail" d="M2 13.5H30M2 21.5H30"/><path class="pk" d="M5 28V10.5L7 7L9 10.5V28ZM14 28V9.5L16 6L18 9.5V28ZM23 28V10.5L25 7L27 10.5V28Z"/></g></svg>
    <span class="name">modfence</span>
  </div>
  <label class="sr" for="picker">Project</label>
  <select id="picker" class="picker"></select>
  <input id="addpath" class="picker addpath" hidden placeholder="Full path of a project folder, then Enter" aria-label="Open another project">
  <span id="stats" class="stats mono"></span>
  <div class="search" role="search">
    <label class="sr" for="find">Find a module</label>
    <input id="find" type="search" autocomplete="off" placeholder="Find module" aria-controls="findlist" aria-expanded="false" aria-autocomplete="list">
    <kbd>/</kbd>
    <ul id="findlist" class="findlist" role="listbox" hidden></ul>
  </div>
</header>

<div class="runbar" id="runbar" hidden role="status" aria-live="polite"></div>

<main class="stage" id="stage">
  <div id="canvas" class="canvas" aria-label="Module graph">
    <svg id="graph" role="group" aria-label="Modules and their imports">
      <defs>
        <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" class="hatch-bg"/><line x1="0" y1="0" x2="0" y2="8" class="hatch-line"/></pattern>
        <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" class="dot-fill"/></pattern>
        <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="arrow" d="M0 1.5L10 5L0 8.5L2.6 5z"/></marker>
        <marker id="ah-dep" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="arrow dep" d="M0 1.5L10 5L0 8.5L2.6 5z"/></marker>
        <marker id="ah-use" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="arrow use" d="M0 1.5L10 5L0 8.5L2.6 5z"/></marker>
      </defs>
      <g id="world"><g id="edges"></g><g id="nodes"></g></g>
    </svg>
  </div>

  <div class="legend" id="legend" aria-label="Legend"></div>
  <nav class="crumbs" id="crumbs" aria-label="Open folder" hidden></nav>
  <div class="pick" id="pick" role="dialog" aria-label="Selected box" hidden></div>
  <div class="hint" id="hint">Click a box to see it. <kbd>/</kbd> find</div>

  <aside class="panel" id="panel" aria-label="Module" inert>
    <div class="grip" id="grip" role="separator" aria-orientation="vertical" aria-label="Resize panel" tabindex="0"></div>
    <div class="phead">
      <div class="ptitle">
        <h2 class="mid mono" id="mname"></h2>
        <p class="mdoc" id="mdoc"></p>
        <p class="mfacts mono" id="mfacts"></p>
      </div>
      <button class="btn icon" id="close" type="button" aria-label="Close panel (Esc)" title="Close (Esc)"><svg viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
    </div>
    <div class="pbody" id="pbody">
      <section class="view" id="v-talk" aria-live="polite"></section>
    </div>
  </aside>
</main>

<div class="tip" id="tip" role="tooltip"></div>
<button class="toast" id="toast" type="button" role="status" aria-live="polite"><span id="ttext"></span></button>

<script src="app.js"></script>
</body>
</html>
