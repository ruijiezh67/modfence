<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="modfence: a hand-drawn little fence">
  <defs>
    <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="4.5"/>
    </filter>
    <g id="fence">
      <path d="M8 104 H292 M8 156 H292" fill="none" stroke-width="7" stroke-linecap="round"/>
      <path d="M20 196 V66 L38 40 L56 66 V196 Z M86 196 V60 L104 34 L122 60 V196 Z M152 196 V66 L170 40 L188 66 V196 Z M218 196 V60 L236 34 L254 60 V196 Z" stroke-width="6" stroke-linejoin="round"/>
      <path d="M2 200 C60 196 120 203 180 199 S270 197 300 200" fill="none" stroke-width="5" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="880" height="220" rx="14" fill="#f3eee3"/>
  <g transform="translate(40 0)" filter="url(#pencil)">
    <use href="#fence" transform="translate(5 4)" fill="none" stroke="#ff48b0" opacity="0.85"/>
    <use href="#fence" fill="#fbf8f1" stroke="#22201c"/>
  </g>
  <g filter="url(#pencil)" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-weight="700">
    <text x="384" y="124" font-size="78" fill="#ff48b0" opacity="0.85" letter-spacing="-2">modfence</text>
    <text x="380" y="120" font-size="78" fill="#22201c" letter-spacing="-2">modfence</text>
    <text x="384" y="166" font-size="22" fill="#4c473e" font-weight="400">vibe code one module at a time</text>
  </g>
</svg>
